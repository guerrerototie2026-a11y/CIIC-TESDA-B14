
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCash | Cash In</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h1 class="logo">JCash</h1>
        <h2>Cash In</h2>
        <p class="subtitle">Add money to your account.</p>

        <p class="error"
           th:if="${error}"
           th:text="${error}">
        </p>

        <form th:action="@{/cash-in}" method="post">

            <label>Amount (PHP)</label>

            <input type="number"
                   name="amount"
                   placeholder="Enter amount"
                   min="0.01"
                   step="0.01"
                   required>

            <button type="submit">Confirm Cash In</button>

        </form>

        <p class="auth-footer">
            <a th:href="@{/dashboard}">Back to Dashboard</a>
        </p>

    </div>

</div>

</body>
</html>
